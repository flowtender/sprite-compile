[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-compile"
version = "0.1.0"
description = "Shared core for discord.py bots: config, secrets, storage, UX primitives"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    # 2.7.1: fixes a ui.LayoutView memory leak; adds modal checkboxes and radio groups
    "discord.py>=2.7.1,<3",
    "msgspec>=0.18.6",
    "platformdirs>=4.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
